        <div><span class="s-label">定投总浮盈亏 </span><span class="s-value" style="color:${sumPnl>0?'var(--up)':'var(--down)'}">${anyValue?(sumPnl>=0?'+':'-')+'$'+fmt(Math.abs(sumPnl),2):'-'}</span></div>
        <div><span class="s-label">总回报率 </span><span class="s-value" style="color:${(totalPnlPct||0)>0?'var(--up)':'var(--down)'}">${totalPnlPct===null?'-':(totalPnlPct>=0?'+':'')+pct(totalPnlPct)}</span></div>
      </div>
    ` : `<div style="color:var(--text-dim);font-size:12px;">暂无定投计划，点击上方"＋ 添加定投计划"开始追踪</div>`;
  }
}

function render(){
  // iOS Safari 兼容修复：这里每次都会把整块内容用 innerHTML 全量重建，正在编辑、仍处于聚焦
  // 状态的输入框也会被整个销毁重建。iOS Safari 在"聚焦的输入框被强制移除"时会触发它自己的
  // 键盘收起/滚动调整逻辑，行为不可预期，表现为编辑一个字段或切换盈亏榜排序后页面跳到别处
  // （安卓 Chrome 不会这样）。这里先记住当前滚动位置，并在销毁前主动 blur 掉正在编辑的输入框，
  // 让浏览器按正常流程处理，重建完成后再强制把滚动位置复原。
  const __scrollY = window.scrollY;
  const __activeEl = document.activeElement;
  if(__activeEl && __activeEl !== document.body && typeof __activeEl.blur === 'function'){
    __activeEl.blur();
  }
  renderMarketSessionBadge();
  renderWorldClockManager();
  renderWorldClock();
  const list = document.getElementById('stockList');
  list.innerHTML = '';

  const computed = state.stocks.map(s=>({s, c: computeStock(s)}));
  const dcaComputed = (state.dcaPlans||[]).map(p=>({p, c: computeDcaPlan(p)}));
  const totalStockValue = computed.reduce((sum,{c})=> sum + (c.marketValue||0), 0);
  const dcaTotalValue = dcaComputed.reduce((sum,{c})=> sum + (c.marketValue||0), 0);
  const dcaTotalInvested = dcaComputed.reduce((sum,{c})=> sum + (c.totalInvested||0), 0);
  const dcaTotalPnl = dcaComputed.reduce((sum,{c})=> sum + (c.pnl!==null ? c.pnl : 0), 0);
  const dcaAnyValue = dcaComputed.some(({c})=>c.marketValue!==null);
  const combinedStockValue = totalStockValue + dcaTotalValue;
  const cashUsed = computed.reduce((sum,{c})=> sum + c.newCostTotal, 0) + dcaTotalInvested;
  const cashRemaining = state.initialCash - cashUsed;
  const totalAssets = cashRemaining + combinedStockValue + (state.otherAdjustment||0);
  const anyPriceSet = computed.some(({c})=>c.marketValue!==null) || dcaAnyValue;
  const anySells = computed.some(({c})=>c.soldShares>0);
  const totalCostBasis = computed.reduce((sum,{c})=> sum + (c.marketValue!==null ? c.newCostTotal : 0), 0);
  const totalBoughtCost = computed.reduce((sum,{c})=> sum + c.boughtCostTotal, 0) + dcaTotalInvested;
  const totalUnrealizedPnL = anyPriceSet ? (computed.reduce((sum,{c})=> sum + (c.pnl!==null ? c.pnl : 0), 0) + dcaTotalPnl) : null;
  const totalRealizedPnL = computed.reduce((sum,{c})=> sum + (c.realizedPnl||0), 0);
  const totalPnL = (anyPriceSet || anySells) ? (totalUnrealizedPnL||0) + totalRealizedPnL : null;
  const totalPnLPct = (totalPnL!==null && totalBoughtCost>0) ? totalPnL/totalBoughtCost : null;
  if(anyPriceSet || anySells) updatePnlHistory(totalPnL);
  renderDcaPlans(totalAssets);

  computed.forEach(({s,c})=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.stockId = s.id;

    const pctOfAssets = totalAssets>0 ? (c.marketValue||0)/totalAssets : 0;
    const pctOfStocks = totalStockValue>0 ? (c.marketValue||0)/totalStockValue : 0;
    const targetPctVal = (s.targetPct!==null && s.targetPct!==undefined && s.targetPct!=='') ? Number(s.targetPct) : null;
    // Target % is this stock's share of the STOCK bucket's total market value (not total
    // assets) — e.g. "this stock should be at most 25% of everything held in the Stocks
    // category". The Stocks category's own cap against total assets (e.g. 30%) is set
    // separately via the per-category threshold in the Asset Category Breakdown chart.
    const currentPctNum = pctOfStocks*100;
    const overTarget = targetPctVal!==null && currentPctNum > targetPctVal;
    const riskLabel = c.riskLevel==='off' ? '⚪ 长期持有·不设止损' : (c.riskLevel==='unknown' ? '- 待输入现价/未设止损参考' : (c.riskLevel==='breach' ? '🔴 触发止损' : (c.riskLevel==='warn' ? '🟡 接近止损线' : '🟢 正常持仓')));
    const ma20Label = c.ma20Status==='-' ? '- 未设MA20或未输入现价' : (c.ma20Status==='站上MA20' ? '📈 站上 MA20' : '📉 跌破 MA20');

    card.innerHTML = `
      <div class="card-head">
        <div class="name-wrap">
          <input class="name-input" data-field="name" value="${s.name}">
          <input class="sym-input" data-field="symbol" value="${s.symbol}">
        </div>
        <select class="cat-select-inline" data-field="category">
          <option value="" ${!s.category?'selected':''}>${L('cat_uncategorized')}</option>
          ${state.categories.map(cat=>`<option value="${cat}" ${s.category===cat?'selected':''}>${cat}</option>`).join('')}
        </select>
        <div style="display:flex;gap:6px;">
          <button class="dup-btn" data-action="dupStock">${L('btn_dupStock')}</button>
          <button class="del-btn" data-action="delStock">${L('btn_delStock')}</button>
          <button class="dup-btn" data-action="toggleGridSectionCollapse">${s.gridSectionCollapsed?'展开':'收起'}</button>
        </div>
      </div>
      <div class="unified-grid">
        <div class="field"><label>${EL('stat_sharesHeld')}</label><input type="text" inputmode="numeric" data-field="sharesHeldEdit" value="${c.newShares ?? 0}"></div>
        <div class="field"><label>${EL('stat_avgCost')}</label><input type="text" inputmode="decimal" data-field="avgCostEdit" value="${c.avgCost!==null && c.avgCost!==undefined ? Number(c.avgCost.toFixed(2)) : 0}"></div>

        <div class="grid-divider"></div>

        <div><span class="s-label">${EL('stat_marketValue')} </span><span class="s-value">$${fmt(c.marketValue)}</span></div>
        <div><span class="s-label">${EL('stat_pnlPct')} </span><span class="s-value" style="color:${c.pnlPct>0?'var(--up)':'var(--down)'}">${c.pnlPct===null?'-':(c.pnlPct>=0?'+':'')+pct(c.pnlPct)}</span></div>

        <div class="grid-divider"></div>

        <div class="field highlight"><label>${EL('fld_currentPrice')}</label><input type="text" inputmode="decimal" data-field="currentPrice" placeholder="输入现价" value="${s.currentPrice ?? ''}"></div>
        <div><span class="s-label">${EL('stat_totalPnl')} </span><span class="s-value" style="color:${c.totalPnl>0?'var(--up)':(c.totalPnl<0?'var(--down)':'var(--text)')}">${c.totalPnl===null?'-':(c.totalPnl>=0?'+':'')+fmt(c.totalPnl)}</span></div>

        <div class="grid-divider"></div>

        <div><span class="s-label">${EL('stat_pnl')} </span><span class="s-value" style="color:${c.pnl>0?'var(--up)':'var(--down)'}">${c.pnl===null?'-':(c.pnl>=0?'+':'')+fmt(c.pnl)}</span></div>
        <div><span class="s-label">${EL('stat_realizedPnl')} </span><span class="s-value" style="color:${c.realizedPnl>0?'var(--up)':(c.realizedPnl<0?'var(--down)':'var(--text)')}">${c.soldShares>0 ? (c.realizedPnl>=0?'+':'')+fmt(c.realizedPnl) : '-'}</span></div>

        <div class="grid-divider"></div>

        <div class="field highlight"><label>${EL('fld_ma20')}</label><input type="text" inputmode="decimal" data-field="ma20" placeholder="选填" value="${s.ma20 ?? ''}"></div>
        <div><span class="s-label">${EL('stat_ma20Status')} </span><span class="s-value">${ma20Label}</span></div>

        <div class="grid-divider"></div>

        <div class="field"><label>${EL('fld_budget')}</label><input type="text" inputmode="decimal" data-field="budget" value="${s.budget}"></div>
        <div class="field"><label>${EL('fld_targetPct')}</label><input type="text" inputmode="decimal" data-field="targetPct" placeholder="选填" value="${s.targetPct ?? ''}"></div>

        <div class="grid-divider"></div>

        <div class="field"><label>${EL('fld_stopLossMode')}</label>
          <select data-field="stopLossMode">
            <option value="ratio" ${s.stopLossMode==='ratio'?'selected':''}>${L('mode_ratio')}</option>
            <option value="ma20" ${s.stopLossMode==='ma20'?'selected':''}>${L('mode_ma20')}</option>
            <option value="off" ${s.stopLossMode==='off'?'selected':''}>${L('mode_off')}</option>
          </select>
        </div>
        <div><span class="s-label">${EL('stat_riskStatus')} </span><span class="s-value">${riskLabel}</span></div>

        <div class="grid-divider"></div>

        <div class="field"><label>${EL('fld_stopLossPct')}</label><input type="text" inputmode="decimal" data-field="stopLossPct" value="${s.stopLossPct}"></div>
        <div><span class="s-label">${EL('stat_stopLine')} </span><span class="s-value" style="color:var(--stamp)">${c.stopLossPrice===null?'-':'$'+fmt(c.stopLossPrice,2)}</span></div>

        <div class="grid-divider"></div>

        <div><span class="s-label">${EL('stat_pctAssets')} </span><span class="s-value">${pct(pctOfAssets)}</span></div>
        <div><span class="s-label">${EL('stat_supportRounds')} </span><span class="s-value">${(()=>{ const nextTier = c.plannedList.find(b=>!b.executed); if(!nextTier || !nextTier.plannedAmt) return '-'; return Math.floor(cashRemaining/nextTier.plannedAmt); })()}</span></div>

        <div style="grid-column:1/-1;text-align:left;"><span class="s-label">${EL('stat_pctStocks')} </span><span class="s-value" style="color:${overTarget?'var(--stamp)':'var(--text)'}">${pct(pctOfStocks)}${overTarget?' ⚠':''}</span></div>
      </div>
      <div class="unified-grid unified-grid-tail">
        <div class="grid-divider"></div>

        <div class="field field-wide" style="grid-column:1/-1;"><label>${EL('fld_buyReason')}</label><input type="text" data-field="buyReason" placeholder="选填" value="${s.buyReason ?? ''}"></div>
      </div>
      ${s.gridSectionCollapsed ? `
      <div style="padding:10px 2px 4px;color:var(--text-dim);font-size:12px;">
        已收起 · 建仓档位 ${c.plannedList.filter(b=>b.executed).length}/${c.plannedList.length} 已执行 ｜ 卖出记录 ${c.sellList.length} 条
      </div>
      ` : `
      <div class="batches-toolbar">
        <button data-action="toggleAllBatches">${(s.batches.length>0 && s.batches.every(b=>b.collapsed)) ? L('batch_expandAll') : L('batch_collapseAll')}</button>
      </div>
      <div class="batches">
        ${c.plannedList.map(b=>{
          const price = s.currentPrice;
          const isReady = !b.executed && price!==null && price!==undefined && price!=='' && b.trigger && Number(price) <= Number(b.trigger);
          const statusClass = b.executed ? 'done' : (isReady ? 'ready' : 'wait');
          const statusText = b.executed ? L('status_done') : (isReady ? L('status_ready') : L('status_wait'));
          const settleAmt = (b.actualPrice!==null && b.actualPrice!==undefined) ? b.actualPrice*(b.actualShares ?? b.plannedShares) : 0;
          const isCollapsed = !!b.collapsed;
          return `
          <div class="batch-block" data-batch="${b.id}">
            <div class="batch-top">
              <button class="batch-toggle" data-bfield="toggleCollapse" title="${L('batch_toggleTitle')}">${isCollapsed?'▶':'▼'}</button>
              <span class="tag">${b.tag}</span>
              <label style="font-size:11px;color:var(--text-dim)">${EL('batch_triggerLabel')}</label>
              <input class="trigger-input" type="text" inputmode="decimal" data-bfield="trigger" value="${b.trigger ?? ''}" placeholder="触发价">
              <label style="font-size:11px;color:var(--text-dim)">${EL('batch_pctLabel')}</label>
              <input class="trigger-input" type="text" inputmode="decimal" data-bfield="pctPercent" value="${Math.round(b.pct*1000)/10}" style="width:42px;" placeholder="权重%">
              <span class="status ${statusClass} editable-label" data-label-key="${b.executed ? 'status_done' : (isReady ? 'status_ready' : 'status_wait')}">${statusText}</span>
            </div>
            ${isCollapsed ? `
            <div class="batch-collapsed-summary">🔍 ${L('batch_collapsedApprox')}${fmt(b.plannedShares)}${L('batch_collapsedShares')} · $${fmt(b.plannedAmt)}${settleAmt>0 ? ' · ' + EL('batch_settlePrefix') + '$' + fmt(settleAmt,2) : ''}</div>
            ` : `
            <div class="plan-line">🔍 当前测算应购：约 <input class="plan-shares-input" type="text" inputmode="numeric" data-bfield="plannedSharesEdit" value="${b.plannedShares}"> 股 ｜ 预计投入金额：$${fmt(b.plannedAmt)}</div>
            <div class="actual-row">
              <div class="field"><label>${EL('batch_actualPriceLabel')}</label><input type="text" inputmode="decimal" data-bfield="actualPrice" value="${b.actualPrice ?? ''}" placeholder="真实成交价"></div>
              <div class="field"><label>${EL('batch_actualSharesLabel')}</label><input type="text" inputmode="numeric" data-bfield="actualShares" value="${b.actualShares ?? ''}" placeholder="${b.plannedShares}"></div>
              <div class="exec-toggle ${b.executed?'on':''}" data-bfield="toggleExec">${b.executed?L('batch_execDone'):L('batch_markExec')}</div>
            </div>
            <div class="settle-line">${EL('batch_settlePrefix')}$${fmt(settleAmt,2)} <button class="del-batch" data-bfield="delBatch">${L('batch_delBatch')}</button></div>
            `}
          </div>`;
        }).join('')}
        <button class="add-batch-btn" data-action="addBatch">${L('btn_addBatch')}</button>
      </div>
      <div class="section-title section-title-sub" style="margin-top:14px;"><span class="editable-label" data-label-key="section_sells">${L('section_sells')}</span></div>
      <div class="sells">
        ${c.sellList.map(sl=>{
          const proceeds = (sl.shares||0)*(sl.price||0);
          const realized = (sl.shares||0)*((sl.price||0) - c.avgCost);
          return `
          <div class="sell-block" data-sell="${sl.id}">
            <div class="batch-top">
              <label style="font-size:11px;color:var(--text-dim)">${EL('sell_dateLabel')}</label>
              <input class="trigger-input" type="date" data-sfield="date" value="${sl.date||''}" style="width:132px;">
              <label style="font-size:11px;color:var(--text-dim)">${EL('sell_sharesLabel')}</label>
              <input class="trigger-input" type="text" inputmode="numeric" data-sfield="shares" value="${sl.shares ?? ''}" style="width:64px;">
              <label style="font-size:11px;color:var(--text-dim)">${EL('sell_priceLabel')}</label>
              <input class="trigger-input" type="text" inputmode="decimal" data-sfield="price" value="${sl.price ?? ''}" style="width:70px;">
            </div>
            <input type="text" class="sell-note-input" data-sfield="note" value="${sl.note ?? ''}" placeholder="${L('sell_noteLabel')}">
            <div class="settle-line">${EL('sell_proceedsPrefix')}$${fmt(proceeds,2)} ｜ ${EL('sell_realizedPrefix')}<span style="color:${realized>=0?'var(--up)':'var(--down)'}">${realized>=0?'+':''}$${fmt(realized,2)}</span> <button class="del-batch" data-sfield="delSell">${L('sell_delSell')}</button></div>
          </div>`;
        }).join('') || `<div style="color:var(--text-dim);font-size:12px;padding:2px 0 6px;">${L('sell_empty')}</div>`}
        <button class="add-batch-btn" data-action="addSell">${L('btn_addSell')}</button>
      </div>
      `}
    `;

    card.querySelectorAll('[data-field]').forEach(el=>{
      el.addEventListener('change', async (e)=>{
        pushUndo();
        const field = e.target.dataset.field;

        // "当前持有股数" / "摊薄后成本价" are editable calibration points. Recompute the
        // internal base (origShares/origCost) so that, combined with whatever grid tiers
        // have already executed, they reproduce exactly the values the user just typed —
        // and so future tier executions keep adding on top correctly.
        if(field === 'sharesHeldEdit' || field === 'avgCostEdit'){
          const sharesInput = card.querySelector('[data-field="sharesHeldEdit"]');
          const avgCostInput = card.querySelector('[data-field="avgCostEdit"]');
          const sharesVal = Number(sharesInput.value) || 0;
          const avgCostVal = Number(avgCostInput.value) || 0;
          const boughtSharesNew = sharesVal + (c.soldShares||0);
          const origSharesNew = boughtSharesNew - (c.execShares||0);
          const boughtCostTotalNew = avgCostVal * boughtSharesNew;
          const origCostNew = origSharesNew !== 0 ? (boughtCostTotalNew - (c.execAmt||0)) / origSharesNew : 0;
          s.origShares = origSharesNew;
          s.origCost = origCostNew;
          await saveState();
          render();
          return;
        }

        let val = e.target.value;
        if(['origShares','origCost','budget','stopLossPct','currentPrice','ma20','targetPct'].includes(field)){
          val = val === '' ? (['currentPrice','ma20','targetPct'].includes(field) ? null : 0) : Number(val);
        }
        s[field] = val;
        await saveState();
        render();
      });
    });

    card.querySelector('[data-action="delStock"]').addEventListener('click', async ()=>{
      pushUndo();
      state.stocks = state.stocks.filter(x=>x.id!==s.id);
      await saveState();
      render();
    });

    card.querySelector('[data-action="dupStock"]').addEventListener('click', async ()=>{
      pushUndo();
      const clone = JSON.parse(JSON.stringify(s));
      clone.id = cryptoId();
      clone.name = clone.name + ' 副本';
      clone.batches = clone.batches.map(b=>({...b, id: cryptoId()}));
      clone.sells = (clone.sells||[]).map(sl=>({...sl, id: cryptoId()}));
      const idx = state.stocks.findIndex(x=>x.id===s.id);
      state.stocks.splice(idx+1, 0, clone);
      await saveState();
      render();
    });

    const addBatchBtn = card.querySelector('[data-action="addBatch"]');
    if(addBatchBtn){
      addBatchBtn.addEventListener('click', async ()=>{
        pushUndo();
        s.batches.push(mkBatch('T'+(s.batches.length+1), 0.20, null));
        await saveState();
        render();
      });
    }

    const toggleAllBtn = card.querySelector('[data-action="toggleAllBatches"]');
    if(toggleAllBtn){
      toggleAllBtn.addEventListener('click', async ()=>{
        // If every tier is already collapsed, this expands them all; otherwise
        // (mixed or all-expanded) it collapses them all — same "collapse first"
        // priority the button's own label already reflects.
        const allCollapsed = s.batches.length>0 && s.batches.every(b=>b.collapsed);
        s.batches.forEach(b=>{ b.collapsed = !allCollapsed; });
        await saveState();
        render();
      });
    }

    const toggleGridSectionBtn = card.querySelector('[data-action="toggleGridSectionCollapse"]');
    if(toggleGridSectionBtn){
      toggleGridSectionBtn.addEventListener('click', async ()=>{
        // Pure display toggle, not a data edit — skip pushUndo() so collapsing/
        // expanding the grid-tier + sell-record section doesn't clutter the undo
        // history, but still persist it so the layout stays put after a reload.
        s.gridSectionCollapsed = !s.gridSectionCollapsed;
        await saveState();
        render();
      });
    }

    const addSellBtn = card.querySelector('[data-action="addSell"]');
    if(addSellBtn){
      addSellBtn.addEventListener('click', async ()=>{
        pushUndo();
        if(!s.sells) s.sells = [];
        const todayStr = new Date().toISOString().slice(0,10);
        s.sells.push(mkSell(todayStr, null, null, ''));
        await saveState();
        render();
      });
    }

    card.querySelectorAll('.sell-block').forEach(block=>{
      const sellId = block.dataset.sell;
      const sl = (s.sells||[]).find(x=>x.id===sellId);
      if(!sl) return;
      block.querySelectorAll('[data-sfield]').forEach(el=>{
        const sfield = el.dataset.sfield;
        if(sfield === 'delSell'){
          el.addEventListener('click', async ()=>{
            pushUndo();
            s.sells = s.sells.filter(x=>x.id!==sellId);
            await saveState();
            render();
          });
        } else if(sfield === 'date' || sfield === 'note'){
          el.addEventListener('change', async (e)=>{
            pushUndo();
            sl[sfield] = e.target.value;
            await saveState();
            render();
          });
        } else {
          el.addEventListener('change', async (e)=>{
            pushUndo();
            let val = e.target.value === '' ? null : Number(e.target.value);
            sl[sfield] = val;
            await saveState();
            render();
          });
        }
      });
    });

    card.querySelectorAll('.batch-block').forEach(block=>{
      const batchId = block.dataset.batch;
      const b = s.batches.find(x=>x.id===batchId);
      block.querySelectorAll('[data-bfield]').forEach(el=>{
        const bfield = el.dataset.bfield;
        if(bfield === 'toggleExec'){
          el.addEventListener('click', async ()=>{
            pushUndo();
            b.executed = !b.executed;
            await saveState();
            render();
          });
        } else if(bfield === 'toggleCollapse'){
          // A pure display toggle, not a data edit — skip pushUndo() so collapsing/
          // expanding a tier doesn't clutter the undo history, but still persist it
          // so the layout stays the way the user left it after a reload.
          el.addEventListener('click', async ()=>{
            b.collapsed = !b.collapsed;
            await saveState();
            render();
          });
        } else if(bfield === 'delBatch'){
          el.addEventListener('click', async ()=>{
            pushUndo();
            s.batches = s.batches.filter(x=>x.id!==batchId);
            await saveState();
            render();
          });
        } else if(bfield === 'pctPercent'){
          el.addEventListener('change', async (e)=>{
            pushUndo();
            let val = e.target.value === '' ? 0 : Number(e.target.value);
            b.pct = val/100;
            await saveState();
            render();
          });
        } else if(bfield === 'plannedSharesEdit'){
          // Reverse of the normal pct -> plannedShares calculation: back-solve pct from
          // the shares count the user just typed, using this tier's trigger price and the
          // stock's total budget. Needs both to be set (a trigger price and a budget) or
          // there's nothing to convert the share count into a weight against.
          el.addEventListener('change', async (e)=>{
            pushUndo();
            const sharesVal = e.target.value === '' ? 0 : Number(e.target.value);
            const trigger = Number(b.trigger) || 0;
            const budget = Number(s.budget) || 0;
            if(trigger > 0 && budget > 0){
              const newAmt = sharesVal * trigger;
              b.pct = newAmt / budget;
            }
            await saveState();
            render();
          });
        } else {
          el.addEventListener('change', async (e)=>{
            pushUndo();
            let val = e.target.value === '' ? null : Number(e.target.value);
            b[bfield] = val;
            await saveState();
            render();
          });
        }
      });
    });

    list.appendChild(card);
  });

  document.getElementById('topSummary').innerHTML = `
    <div class="chip"><div class="label">${EL('chip_totalAssets')}</div><div class="value">$${fmt(totalAssets)}</div></div>
    <div class="chip"><div class="label">${EL('chip_totalStockValue')}</div><div class="value">$${fmt(combinedStockValue)}</div></div>
    <div class="chip"><div class="label">${EL('chip_cashRemaining')}</div><div class="value">$${fmt(cashRemaining)}</div></div>
    <div class="chip"><div class="label">${EL('chip_cashUsed')}</div><div class="value">$${fmt(cashUsed)}</div></div>
    <div class="chip"><div class="label">${EL('chip_totalPnl')}</div><div class="value" style="color:${totalPnL===null?'var(--text-dim)':(totalPnL>=0?'var(--up)':'var(--down)')}">${totalPnL===null?'-':(totalPnL>=0?'+':'')+'$'+fmt(totalPnL)}</div></div>
    <div class="chip"><div class="label">${EL('chip_totalPnlPct')}</div><div class="value" style="color:${totalPnLPct===null?'var(--text-dim)':(totalPnLPct>=0?'var(--up)':'var(--down)')}">${totalPnLPct===null?'-':(totalPnLPct>=0?'+':'')+pct(totalPnLPct)}</div></div>
    <div class="chip"><div class="label">${EL('chip_realizedPnl')}</div><div class="value" style="color:${totalRealizedPnL===0?'var(--text-dim)':(totalRealizedPnL>0?'var(--up)':'var(--down)')}">${(totalRealizedPnL>=0?'+':'')+'$'+fmt(totalRealizedPnL)}</div></div>
    <div class="chip"><div class="label">${EL('chip_unrealizedPnl')}</div><div class="value" style="color:${totalUnrealizedPnL===null?'var(--text-dim)':(totalUnrealizedPnL>=0?'var(--up)':'var(--down)')}">${totalUnrealizedPnL===null?'-':(totalUnrealizedPnL>=0?'+':'')+'$'+fmt(totalUnrealizedPnL)}</div></div>
  `;

  if(!state.medalThresholds) state.medalThresholds = {bronze:0.15, silver:0.50, gold:1.00};
  const MEDALS = [
    {icon:'🥉', key:'medal_bronze', thresholdKey:'bronze'},
    {icon:'🥈', key:'medal_silver', thresholdKey:'silver'},
    {icon:'🥇', key:'medal_gold', thresholdKey:'gold'},
  ];
  let achievedIdx = -1;
  if(totalPnLPct !== null){
    for(let i=MEDALS.length-1;i>=0;i--){
      if(totalPnLPct >= state.medalThresholds[MEDALS[i].thresholdKey]){ achievedIdx = i; break; }
    }
  }
  document.getElementById('milestones').innerHTML = MEDALS.map((m,i)=>{
    const achieved = i === achievedIdx;
    const thresholdVal = state.medalThresholds[m.thresholdKey];
    return `<div class="medal ${achieved?'achieved':''}">
      <div class="medal-icon">${m.icon}</div>
      <div class="medal-label editable-label" data-label-key="${m.key}">${L(m.key)}</div>
      <div class="medal-threshold"><input type="text" inputmode="decimal" class="medal-threshold-input" data-medal="${m.thresholdKey}" value="${Math.round(thresholdVal*1000)/10}">%</div>
    </div>`;
  }).join('');
  document.querySelectorAll('.medal-threshold-input').forEach(inp=>{
    inp.addEventListener('change', async (e)=>{
      pushUndo();
      const key = e.target.dataset.medal;
      const val = e.target.value === '' ? 0 : Number(e.target.value);
      state.medalThresholds[key] = val/100;
      await saveState();
      render();
    });
  });

  const allUnexecutedAmts = [];
  // "Planned commitment" only counts each stock's NEXT unexecuted tier (the one that
  // would trigger first as price drops), not every tier ever planned. Summing every
  // future tier across every stock assumes all of them fire at once, which is an
  // unrealistic worst case and made this number look permanently alarming.
  let plannedCommitted = 0;
  computed.forEach(({c})=>{
    c.plannedList.forEach(b=>{ if(!b.executed){ allUnexecutedAmts.push(b.plannedAmt); } });
    const nextTier = c.plannedList.find(b=>!b.executed);
    if(nextTier){ plannedCommitted += nextTier.plannedAmt; }
  });
  const avgTierAmt = allUnexecutedAmts.length>0 ? allUnexecutedAmts.reduce((a,b)=>a+b,0)/allUnexecutedAmts.length : 0;
  const roundsSupported = avgTierAmt>0 ? Math.floor(cashRemaining/avgTierAmt) : null;
  const safeReserve = cashRemaining - plannedCommitted;

  document.getElementById('cashCard').innerHTML = `
    <div style="margin-bottom:10px;">${EL('cash_initialLabel')}<input type="text" inputmode="decimal" id="initialCashInput" value="${state.initialCash}"></div>
    <div style="margin-bottom:10px;">${EL('cash_adjLabel')}<input type="text" inputmode="decimal" id="otherAdjInput" value="${state.otherAdjustment||0}"></div>
    <div>${EL('cash_usedLine')}<b>$${fmt(cashUsed)}</b></div>
    <div>${EL('cash_remainLine')}<b>$${fmt(cashRemaining)}</b></div>
    <div>${EL('cash_stockValueLine')}<b>$${fmt(combinedStockValue)}</b></div>
    <div style="font-size:11.5px;color:var(--text-dim);margin:2px 0 8px;">其中：网格持仓 <b>$${fmt(totalStockValue)}</b> ｜ 定投持仓 <b>$${fmt(dcaTotalValue)}</b>（已投入 $${fmt(dcaTotalInvested)}）</div>
    <div>${EL('cash_totalLine')}<b style="color:var(--gold)">$${fmt(totalAssets)}</b></div>
    <div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);">${EL('cash_plannedLine')}<b>$${fmt(plannedCommitted)}</b></div>
    <div>${EL('cash_safeReserveLine')}<b style="color:${safeReserve<0?'var(--down)':'var(--text)'}">$${fmt(safeReserve)}</b>${safeReserve<0?' ⚠ '+L('cash_safeReserveWarn'):''}</div>
    <div>${EL('cash_ammoLabel')}<b>${roundsSupported===null?'-':roundsSupported}</b> ${L('cash_ammoUnit')}</div>
  `;
  document.getElementById('initialCashInput').addEventListener('change', async (e)=>{
    pushUndo();
    state.initialCash = e.target.value === '' ? 0 : Number(e.target.value);
    await saveState();
    render();
  });
  document.getElementById('otherAdjInput').addEventListener('change', async (e)=>{
    pushUndo();
    state.otherAdjustment = e.target.value === '' ? 0 : Number(e.target.value);
    await saveState();
    render();
  });

  const wb = document.getElementById('weightBars');
  const unifiedRows = [
    ...computed.map(({s,c})=>({name:s.name, symbol:s.symbol, marketValue:c.marketValue})),
    ...dcaComputed.map(({p,c})=>({name:p.name+'（定投）', symbol:p.symbol, marketValue:c.marketValue})),
  ];
  const sorted = unifiedRows.slice().sort((a,b)=>(b.marketValue||0)-(a.marketValue||0));
  wb.innerHTML = sorted.map(({name,symbol,marketValue})=>{
    const w = combinedStockValue>0 ? (marketValue||0)/combinedStockValue : 0;
    return `
      <div class="weight-row">
        <div class="wr-top">
          <span class="wr-name">${name} (${symbol})</span>
          <span class="wr-pct">${EL('wr_pctLabel')}${pct(w)} ${EL('wr_valueLabel')}$${fmt(marketValue)}</span>
        </div>
        <div class="weight-bar-bg"><div class="weight-bar-fill" style="width:${(w*100).toFixed(1)}%"></div></div>
      </div>
    `;
  }).join('') || `<div class="editable-label" data-label-key="empty_weights" style="color:var(--text-dim);font-size:12px;">${L('empty_weights')}</div>`;

  const quickBtnEl = document.getElementById('quickRefreshBtn');
  if(quickBtnEl && !quickBtnEl.disabled){ quickBtnEl.textContent = L('refresh_quickBtn'); }
  renderRefreshCard();
  renderCategoryManager();
  buildCategoryChart(totalAssets, cashRemaining);

  document.getElementById('pnlRankChart').innerHTML = buildPnlRankChart();

  document.getElementById('trendChart').innerHTML = buildTrendChart();
  renderTrendMinMax();

  syncStaticLabels();

  // 两帧之后再恢复滚动位置：第一帧等待新内容布局稳定，第二帧用来覆盖 iOS Safari 自身
  // 在输入框被移除时可能触发的滚动调整，确保最终停在用户编辑前的位置。
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      window.scrollTo(0, __scrollY);
    });
  });
}

document.getElementById('addStockBtn').addEventListener('click', async ()=>{
  pushUndo();
  state.stocks.push(mkStock('NEW','新标的',0,0,0,15,null,[
    mkBatch('T1',0.30,null),mkBatch('T2',0.35,null),mkBatch('T3',0.35,null)
  ]));
  await saveState();
  render();
});

document.getElementById('addDcaBtn').addEventListener('click', async ()=>{
  pushUndo();
  if(!state.dcaPlans) state.dcaPlans = [];
  const todayStr = new Date().toISOString().slice(0,10);
  state.dcaPlans.push(mkDcaPlan('SPY','标普500 ETF',1000,'monthly',todayStr,null,'宽基ETF'));
  await saveState();
  render();
});

document.getElementById('undoBtn').addEventListener('click', undoLast);

(async ()=>{
  await loadState();
  document.getElementById('pageTitle').value = state.title;
  document.getElementById('pageTitle').addEventListener('change', async (e)=>{
    pushUndo();
    state.title = e.target.value;
    await saveState();
  });
  document.getElementById('langSwitcher').value = state.language || 'zh';
  document.getElementById('langSwitcher').addEventListener('change', async (e)=>{
    pushUndo();
    state.language = e.target.value;
    await saveState();
    render();
  });
  document.getElementById('quickRefreshBtn').textContent = L('refresh_quickBtn');
  document.getElementById('quickRefreshBtn').addEventListener('click', refreshAllPrices);
  renderMarketSessionBadge();
  setInterval(()=>{ renderMarketSessionBadge(); renderWorldClock(); }, 30000);
  // Tapping/clicking anywhere outside a world-clock card hides its just-revealed
  // delete button again, so it doesn't stay exposed after the long-press ends.
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('.world-clock-card')){
      document.querySelectorAll('.world-clock-card.show-delete').forEach(c=>c.classList.remove('show-delete'));
    }
  });
  document.getElementById('pnlSortToggleBtn').addEventListener('click', async ()=>{
    pushUndo();
    state.pnlSortDir = (state.pnlSortDir === 'asc') ? 'desc' : 'asc';
    await saveState();
    render();
  });
  document.getElementById('pnlSortMetricBtn').addEventListener('click', async ()=>{
    pushUndo();
    state.pnlSortMetric = (state.pnlSortMetric === 'pct') ? 'amount' : 'pct';
    await saveState();
    render();
  });
  render();

  // 双击任意可编辑标签文字，弹出输入框修改，失焦/回车后保存
  document.body.addEventListener('dblclick', async (e)=>{
    const target = e.target.closest('.editable-label');
    if(!target) return;
    e.preventDefault();
    const key = target.dataset.labelKey;
    const currentText = target.textContent;
    const input = document.createElement('input');
    input.type = 'text';
    input.value = currentText;
    input.className = 'label-edit-input';
    input.style.width = Math.max(60, currentText.length*8) + 'px';
    target.replaceWith(input);
    input.focus();
    input.select();
    // Swap the <input> back into a proper <span class="editable-label"> before/while
    // committing. Elements produced by a dynamic template (inside stockList, dcaList,
    // etc.) get rebuilt fresh on the next render() regardless, but STATIC labels that
    // live directly in the page markup (section titles, footer) are never touched by
    // render() — without this, the input just stays stuck in the DOM permanently
    // instead of turning back into readable, re-editable text.
    const restoreSpan = (text) => {
      const span = document.createElement('span');
      span.className = 'editable-label';
      span.dataset.labelKey = key;
      span.textContent = text;
      input.replaceWith(span);
    };
    let committed = false;
    const commit = async ()=>{
      if(committed) return;
      committed = true;
      const newText = input.value.trim() || currentText;
      if(!state.labels) state.labels = {};
      state.labels[key] = newText;
      restoreSpan(newText);
      await saveState();
      render();
    };
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', (ev)=>{
      if(ev.key === 'Enter'){ input.blur(); }
      if(ev.key === 'Escape'){
        committed = true;
        restoreSpan(currentText);
        render();
      }
    });
  });

  // 导出数据备份为JSON文件，方便跨浏览器/跨设备迁移
  document.getElementById('exportBtn').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateStr = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `持仓台账备份_${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  // 导出Excel（需要联网加载SheetJS库；仅在下载后用普通浏览器打开时可用）
  document.getElementById('exportExcelBtn').addEventListener('click', ()=>{
    if(typeof XLSX === 'undefined'){
      alert('Excel导出功能需要联网加载组件库。如果你是在Claude界面里打开的，请先下载这个文件，再用浏览器（如Safari/Chrome）联网打开后重试。');
      return;
    }
    const computed = state.stocks.map(s=>({s, c: computeStock(s)}));
    const summaryRows = computed.map(({s,c})=>({
      '代码': s.symbol,
      '名称': s.name,
      '原持仓股数': s.origShares,
      '原持仓成本价': s.origCost,
      '本轮建仓预算': s.budget,
      'MA20参考价': s.ma20,
      '止损比例(%)': s.stopLossPct,
      '当前价': s.currentPrice,
      '摊薄后成本价': Number(c.avgCost.toFixed(2)),
      '动态综合止损线': Number(c.stopLossPrice.toFixed(2)),
      '当前持有股数': c.newShares,
      '当前总市值': c.marketValue,
      '未实现盈亏(浮动)': c.pnl,
      '未实现回报率(%)': c.pnlPct!==null ? Number((c.pnlPct*100).toFixed(2)) : null,
      '已实现盈亏': Number(c.realizedPnl.toFixed(2)),
      '累计总盈亏(已实现+未实现)': c.totalPnl!==null ? Number(c.totalPnl.toFixed(2)) : null,
    }));
    const sellRows = [];
    computed.forEach(({s,c})=>{
      c.sellList.forEach(sl=>{
        sellRows.push({
          '代码': s.symbol,
          '卖出日期': sl.date,
          '卖出数量': sl.shares,
          '卖出价格': sl.price,
          '卖出金额': (sl.shares||0)*(sl.price||0),
          '已实现盈亏': Number(((sl.shares||0)*((sl.price||0)-c.avgCost)).toFixed(2)),
          '备注': sl.note || '',
        });
      });
    });
    const batchRows = [];
    computed.forEach(({s,c})=>{
      c.plannedList.forEach(b=>{
        batchRows.push({
          '代码': s.symbol,
          '批次': b.tag,
          '触发价': b.trigger,
          '权重(%)': Math.round(b.pct*1000)/10,
          '计划股数': b.plannedShares,
          '计划金额': Number(b.plannedAmt.toFixed(2)),
          '是否已执行': b.executed ? '是' : '否',
          '实际购买价格': b.actualPrice,
          '实际购买数量': b.actualShares,
        });
      });
    });
    const cashRows = [
      {'项目':'静态初始本金基准', '金额':state.initialCash},
      {'项目':'分红/手续费及其他校正', '金额':state.otherAdjustment||0},
    ];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summaryRows), '持仓汇总');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(batchRows), '建仓批次');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sellRows), '卖出记录');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(cashRows), '现金设置');
    const dateStr = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, `持仓台账导出_${dateStr}.xlsx`);
  });

  // 导入之前导出的JSON备份，恢复全部数据
  document.getElementById('importBtn').addEventListener('click', ()=>{
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async (ev)=>{
      try{
        const imported = JSON.parse(ev.target.result);
        if(!imported || !Array.isArray(imported.stocks)){
          alert('这个文件看起来不是有效的备份文件');
          return;
        }
        pushUndo();
        state = imported;
        if(state.otherAdjustment === undefined) state.otherAdjustment = 0;
        if(state.language === undefined) state.language = 'zh';
        if(state.title === undefined) state.title = '交易系统';
        if(state.labels === undefined) state.labels = {};
        if(state.pnlHistory === undefined) state.pnlHistory = [];
        if(state.categories === undefined) state.categories = ['宽基ETF','行业/主题指数ETF','个股'];
        if(state.medalThresholds === undefined) state.medalThresholds = {bronze:0.15, silver:0.50, gold:1.00};
        if(state.apiKey === undefined) state.apiKey = '';
        if(state.alphaVantageKey === undefined) state.alphaVantageKey = '';
        if(state.pnlSortDir === undefined) state.pnlSortDir = 'desc';
        if(state.pnlSortMetric === undefined) state.pnlSortMetric = 'amount';
        if(state.warnBufferPct === undefined) state.warnBufferPct = 3;
        if(state.concentrationThresholdPct === undefined) state.concentrationThresholdPct = 30;
        if(state.categoryThresholds === undefined) state.categoryThresholds = {};
        if(!state.categoryColors) state.categoryColors = {};
        if(!state.worldClockCities) state.worldClockCities = [
          {id:'auckland', label:'Auckland', tz:'Pacific/Auckland'},
          {id:'tokyo', label:'Tokyo', tz:'Asia/Tokyo'},
          {id:'beijing', label:'Beijing', tz:'Asia/Shanghai'},
          {id:'london', label:'London', tz:'Europe/London'},
          {id:'newyork', label:'New York', tz:'America/New_York'},
        ];
        state.stocks.forEach(s=>{ if(s.ma20 === undefined) s.ma20 = null; if(s.category === undefined) s.category = ''; if(s.stopLossMode === undefined) s.stopLossMode = 'ratio'; if(s.targetPct === undefined) s.targetPct = null; if(s.buyReason === undefined) s.buyReason = ''; if(s.sells === undefined) s.sells = []; });
        if(!state.dcaPlans) state.dcaPlans = [];
        state.dcaPlans.forEach(p=>{
          if(p.category === undefined) p.category = '';
          if(p.executions === undefined) p.executions = [];
          if(p.manualShares === undefined || p.manualAvgCost === undefined){
            let ti=0, ts=0;
            p.executions.forEach(e=>{ const amt=e.amount||0, pr=e.price||0; ti+=amt; ts+= pr>0?amt/pr:0; });
            if(p.manualShares === undefined) p.manualShares = ts;
            if(p.manualAvgCost === undefined) p.manualAvgCost = ts>0 ? ti/ts : 0;
          }
        });
        await saveState();
        document.getElementById('pageTitle').value = state.title;
        render();
        alert('数据导入成功！');
      }catch(err){
        alert('导入失败：文件格式不正确');
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  });
})();
</script>
</body>
</html>
