  :root{
    --bg:#F7F3E9;         /* 米白底色 */
    --surface:#FFFEFA;    /* 卡片米白 */
    --surface-2:#EFEADA;  /* 输入框底色 */
    --surface-3:#E8E1CC;
    --line:#DCD4BC;
    --text:#3A3226;       /* 深棕文字 */
    --text-dim:#8C8367;
    --up:#A6382C;         /* 涨 / 盈利 —— 中国盘面红 */
    --down:#2E6B45;       /* 跌 / 亏损 —— 中国盘面绿 */
    --gold:#8C5A1E;
    --stamp:#8F2E22;
    --highlight:#F0AE5C;  /* 闪算参考价 专属高亮色 */
    --warn-red:#C0392B;
    --warn-yellow:#F2C230;
    --warn-yellow-text:#856E00;
  }
  *{box-sizing:border-box;}
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body{
    margin:0;
    background:var(--bg);
    background-image:
      radial-gradient(circle at 10% 20%, rgba(140,90,30,0.05), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(140,90,30,0.05), transparent 40%);
    color:var(--text);
    font-family:'CharterEmbedded','Charter','Bitstream Charter','Sitka Text',Cambria,'Noto Sans SC', sans-serif;
    padding:0 0 80px;
  }
  header{
    padding:28px 16px 18px;
    border-bottom:2px solid var(--line);
  }
  header h1{
    font-family:'CharterEmbedded','Charter','Bitstream Charter','Sitka Text',Cambria,'Noto Serif SC', serif;
    font-weight:700;
    font-size:22px;
    margin:0 0 12px;
    line-height:0.78;
  }
  .intro-banner{
    background:var(--surface);
    border:1px solid var(--line);
    border-left:4px solid var(--gold);
    border-radius:8px;
    padding:12px 14px;
    font-size:12px;
    color:var(--text-dim);
    line-height:1.08;
  }
  .intro-banner b{ color:var(--text); }

  .lang-switcher-wrap{ margin-top:8px; }
  .lang-switcher-wrap > *{ flex-shrink:0; }
  .market-session-badge{
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding:6px 12px;
    border-radius:8px;
    border:1px solid var(--gold);
    background:var(--surface-3);
    font-size:12px;
    color:var(--gold);
    font-weight:600;
    white-space:nowrap;
    flex:0 0 auto;
    cursor:default;
  }
  .market-session-badge.session-pre{ border-color:#D98A2B; color:#B5691A; background:#FBEBD3; }
  .market-session-badge.session-regular{ border-color:#2E8B57; color:#1F6E43; background:#DFF1E6; }
  .market-session-badge.session-after{ border-color:#C0512E; color:#9C3F22; background:#F5E0D3; }
  .market-session-badge.session-overnight{ border-color:#3B4C8C; color:#2B3866; background:#E1E4F2; }
  .market-session-badge.session-closed{ border-color:var(--line); color:var(--text-dim); background:var(--surface-2); }
  #langSwitcher{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px 10px;
    font-size:12px;
    color:var(--text);
    font-family:'CharterEmbedded','Charter','Bitstream Charter','Sitka Text',Cambria,'Noto Sans SC', sans-serif;
    cursor:pointer;
  }
  #langSwitcher:focus{ outline:2px solid var(--gold); }

  .refresh-card{
    margin-top:10px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    font-size:12px;
    color:var(--text-dim);
  }
  .refresh-card .refresh-row{
    display:flex;
    gap:8px;
    margin-bottom:8px;
    flex-wrap:wrap;
  }
  .refresh-card input{
    flex:1;
    min-width:140px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:7px 8px;
    color:var(--text);
    font-family:'CharterEmbedded','Charter','Bitstream Charter','Sitka Text',Cambria,'IBM Plex Mono', monospace;
    font-size:12px;
  }
  .refresh-card .refresh-note{ line-height:1.02; }

  .pnl-rank-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    font-size:12px;
  }
  .pnl-rank-name{
    width:110px;
    flex-shrink:0;
    color:var(--text);
    font-weight:600;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .pnl-rank-track{
    position:relative;
    height:14px;
    background:var(--surface-2);
    border-radius:4px;
    flex:1;
    min-width:60px;
  }
  .pnl-rank-zero{
    position:absolute;
    left:50%;
    top:0;
    bottom:0;
    width:1px;
    background:var(--line);
  }
  .pnl-rank-bar{
    position:absolute;
    top:1px;
    bottom:1px;
    border-radius:3px;
  }
  .pnl-rank-value{
    width:90px;
    flex-shrink:0;
    text-align:right;
    font-family:'CharterEmbedded','Charter','Bitstream Charter','Sitka Text',Cambria,'IBM Plex Mono', monospace;
    font-weight:700;
  }

  .summary-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px;
    margin-top:10px;
  }
  .summary-grid .chip{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:7px 12px;
  }
  .summary-grid .chip .label{ font-size:11px; color:var(--text-dim); margin-bottom:2px; }
  .summary-grid .chip .value{ font-family:'CharterEmbedded','Charter','Bitstream Charter','Sitka Text',Cambria,'IBM Plex Mono', monospace; font-size:17px; font-weight:700; color:var(--gold); }

  main{ padding:6px 12px 12px; max-width:720px; margin:0 auto; }

  .section-title{
    font-family:'CharterEmbedded','Charter','Bitstream Charter','Sitka Text',Cambria,'Noto Serif SC', serif;
    font-size:16px;
    color:var(--gold);
    margin:8px 0 7px;
    padding-left:10px;
    border-left:3px solid var(--gold);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .section-title-major{
    font-size:19px;
    font-weight:700;
    border-left-width:5px;
    margin-top:20px;
  }
  .section-title-sub{
    font-size:14px;
    margin-left:16px;
    padding-left:8px;
    border-left:2px solid var(--line);
    color:var(--text-dim);
  }
  .add-btn{
    background:var(--surface-3);
    border:1px solid var(--gold);
    color:var(--gold);
    border-radius:8px;
    padding:4px 12px;
    font-size:12px;
    cursor:pointer;
    font-weight:600;
    font-family:'CharterEmbedded','Charter','Bitstream Charter','Sitka Text',Cambria,'IBM Plex Mono', monospace;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--line);

function mkBatch(tag,pct,trigger){
  return { id: cryptoId(), tag, pct, trigger, executed:false, actualPrice:null, actualShares:null };
}
function mkStock(symbol,name,origShares,origCost,budget,stopLossPct,ma20,batches,category,stopLossMode,targetPct,buyReason,sells){
  return { id: cryptoId(), symbol, name, origShares, origCost, budget, stopLossPct, ma20: ma20 ?? null, category: category ?? '', stopLossMode: stopLossMode ?? 'ratio', targetPct: targetPct ?? null, buyReason: buyReason ?? '', currentPrice:null, batches, sells: sells ?? [] };
}
function mkSell(date,shares,price,note){
  return { id: cryptoId(), date: date ?? '', shares: shares ?? null, price: price ?? null, note: note ?? '' };
}
function cryptoId(){ return Math.random().toString(36).slice(2,10); }

function mkDcaPlan(symbol,name,amountPerPeriod,frequency,startDate,currentPrice,category){
  return { id: cryptoId(), symbol: symbol ?? '', name: name ?? '', amountPerPeriod: amountPerPeriod ?? 0, frequency: frequency || 'monthly', startDate: startDate ?? '', currentPrice: currentPrice ?? null, category: category ?? '', manualShares: 0, manualAvgCost: 0, note: '', executions: [] };
}
function mkDcaExec(date,amount,price,note){
  return { id: cryptoId(), date: date ?? '', amount: amount ?? null, price: price ?? null, shares: null, note: note ?? '', executed: false };
}
// 定投执行记录三字段（金额/买入价/买入份额）互算：知道其中两个，自动算出第三个。
// changedField 是刚被用户编辑的那个字段，用来决定优先用哪两个已知值去算第三个。
function recalcDcaExecFields(ex, changedField){
  const hasAmt = ex.amount!=null && ex.amount!=='' && !isNaN(ex.amount);
  const hasPrice = ex.price!=null && ex.price!=='' && !isNaN(ex.price) && ex.price!==0;
  const hasShares = ex.shares!=null && ex.shares!=='' && !isNaN(ex.shares);
  if(changedField==='price'){
    if(hasAmt && hasPrice){ ex.shares = ex.amount/ex.price; }
    else if(hasShares && hasPrice){ ex.amount = ex.shares*ex.price; }
  } else if(changedField==='amount'){
    if(hasPrice){ ex.shares = ex.amount/ex.price; }
    else if(hasShares && ex.shares!==0){ ex.price = ex.amount/ex.shares; }
  } else if(changedField==='shares'){
    if(hasPrice){ ex.amount = ex.shares*ex.price; }
    else if(hasAmt && ex.shares!==0 && ex.shares!=null){ ex.price = ex.amount/ex.shares; }
  }
}
function computeDcaPlan(p){
  const execs = (p.executions||[]).slice().sort((a,b)=>{
    const da=a.date||'', db=b.date||'';
    if(da<db) return -1; if(da>db) return 1; return 0;
  });
  // 有已标记"已执行"的执行记录时，累计份额/摊薄成本改为自动汇总这些记录，
  // 不再依赖手动填写的"累计持有份额/摊薄后成本价"，新增/编辑/删除执行记录会自动联动。
  // 还没有任何执行记录被标记为已执行时，退回手动填写模式（兼容老数据）。
  let execShares = 0, execAmt = 0, anyExecuted = false;
  execs.forEach(e=>{
    if(e.executed){
      anyExecuted = true;
      const shares = e.shares!=null ? e.shares : ((e.price && e.price>0 && e.amount!=null) ? e.amount/e.price : 0);
      const amt = e.amount!=null ? e.amount : (shares*(e.price||0));
      execShares += shares;
      execAmt += amt;
    }
  });
  const autoComputed = anyExecuted;
  const totalShares = autoComputed ? execShares : (p.manualShares || 0);
  const avgCost = autoComputed ? (execShares>0 ? execAmt/execShares : 0) : (p.manualAvgCost || 0);
  const totalInvested = autoComputed ? execAmt : totalShares * avgCost;
  const price = p.currentPrice;
  const marketValue = (price!==null && price!==undefined && totalShares>0) ? totalShares*price : null;
  const pnl = marketValue!==null ? marketValue - totalInvested : null;
  const realizedPnl = 0;
  const totalPnl = pnl!==null ? pnl + realizedPnl : null;
  const pnlPct = (totalPnl!==null && totalInvested>0) ? totalPnl/totalInvested : null;

  const intervalDays = {weekly:7, biweekly:14, monthly:30, quarterly:91}[p.frequency] || 30;
  let nextDue = null;
  const lastDate = execs.length ? execs[execs.length-1].date : null;
  const baseDateStr = lastDate || p.startDate;
  if(baseDateStr){
    const baseDate = new Date(baseDateStr+'T00:00:00');
    if(!isNaN(baseDate.getTime())){
      const next = new Date(baseDate.getTime());
      if(p.frequency==='monthly') next.setMonth(next.getMonth()+1);
      else if(p.frequency==='quarterly') next.setMonth(next.getMonth()+3);
      else next.setDate(next.getDate()+intervalDays);
      nextDue = next.toISOString().slice(0,10);
    }
  }
  const todayStr = new Date().toISOString().slice(0,10);
  const overdue = nextDue!==null && nextDue < todayStr;

  return { execs, totalInvested, totalShares, avgCost, marketValue, pnl, realizedPnl, totalPnl, pnlPct, nextDue, overdue, autoComputed };
}

function rgbToHex(rgb){
  if(!rgb) return '#000000';
  if(rgb.startsWith('#')) return rgb;
  const m = rgb.match(/\d+/g);
  if(!m || m.length < 3) return '#000000';
  return '#' + m.slice(0,3).map(x=>Number(x).toString(16).padStart(2,'0')).join('');
}
function fmt(n, d=0){
  if(n===null || n===undefined || isNaN(n)) return '-';
  return n.toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
}
function pct(n, d=1){
  if(n===null || n===undefined || isNaN(n)) return '-';
  return (n*100).toFixed(d)+'%';
}

// U.S. market session (Eastern Time). Uses Intl's IANA timezone data, which already
// accounts for daylight saving time automatically — no manual DST math needed.
// Standard session boundaries: pre-market 4:00-9:30, regular 9:30-16:00,
// after-hours 16:00-20:00, overnight/closed 20:00-4:00 and all day on weekends.
// (Doesn't know about market holidays — those will show as a normal weekday session.)
// U.S. market holidays (NYSE-observed full closures). This needs updating every year —
// check https://www.nyse.com/markets/hours-calendars for the current official calendar.
// (Deliberately not attempting the "if a holiday falls on a weekend, shift to the nearest
// weekday" rule generically — just listing the actual observed closure date directly.)
const US_MARKET_HOLIDAYS = [
  {date:'2025-01-01', name:"New Year's Day"},
  {date:'2025-01-20', name:'Martin Luther King Jr. Day'},
  {date:'2025-02-17', name:"Washington's Birthday"},
  {date:'2025-04-18', name:'Good Friday'},
  {date:'2025-05-26', name:'Memorial Day'},
  {date:'2025-06-19', name:'Juneteenth'},
  {date:'2025-07-04', name:'Independence Day'},
  {date:'2025-09-01', name:'Labor Day'},
  {date:'2025-11-27', name:'Thanksgiving Day'},
  {date:'2025-12-25', name:'Christmas Day'},
  {date:'2026-01-01', name:"New Year's Day"},
  {date:'2026-01-19', name:'Martin Luther King Jr. Day'},
  {date:'2026-02-16', name:"Washington's Birthday"},
  {date:'2026-04-03', name:'Good Friday'},
  {date:'2026-05-25', name:'Memorial Day'},
  {date:'2026-06-19', name:'Juneteenth'},
  {date:'2026-07-03', name:'Independence Day (observed)'},
  {date:'2026-09-07', name:'Labor Day'},
  {date:'2026-11-26', name:'Thanksgiving Day'},
  {date:'2026-12-25', name:'Christmas Day'},
];

function getMarketSessionInfo(){
  const now = new Date();
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: 'numeric', minute: 'numeric',
    hour12: false, weekday: 'short'
  }).formatToParts(now);
  const map = {};
  parts.forEach(p=>{ map[p.type] = p.value; });
  const weekday = map.weekday; // 'Sun'..'Sat'
  const hour = Number(map.hour) % 24;
  const minute = Number(map.minute);
  const totalMin = hour*60 + minute;
  const dateStr = `${map.year}-${map.month}-${map.day}`;

  const PRE_START = 4*60;
  const REGULAR_START = 9*60 + 30;
  const REGULAR_END = 16*60;
  const AFTER_END = 20*60;

  const timeStr = String(hour).padStart(2,'0') + ':' + String(minute).padStart(2,'0');

  // A full NYSE holiday closes pre/regular/after-hours for that date. (Not modeling
  // whether overnight ATS venues still run into/out of a holiday date — edge case left
  // as a known simplification.)
  const holiday = US_MARKET_HOLIDAYS.find(h=>h.date===dateStr);
  if(holiday){
    return { session:'closed', timeStr, holidayName: holiday.name };
  }

  // Overnight trading (via ATS venues like Blue Ocean/OTC Overnight, offered by brokers
  // such as Webull/Robinhood/Schwab) now runs 8:00 PM-4:00 AM ET, Sunday night through
  // Thursday night — i.e. it bridges into the next session on Mon/Tue/Wed/Thu/Fri
  // mornings, but there is NO Friday-night-into-Saturday or Saturday-into-Sunday
  // session: Fri 8pm through Sun 8pm is genuinely closed.
  let session;
  if(weekday === 'Sat'){
    session = 'closed';
  } else if(weekday === 'Sun'){
    session = (totalMin >= AFTER_END) ? 'overnight' : 'closed';
  } else if(weekday === 'Fri'){
    if(totalMin < PRE_START){ session = 'overnight'; }
    else if(totalMin < REGULAR_START){ session = 'pre'; }
    else if(totalMin < REGULAR_END){ session = 'regular'; }
    else if(totalMin < AFTER_END){ session = 'after'; }
    else { session = 'closed'; } // Friday evening: no overnight session into Saturday
  } else {
    // Mon/Tue/Wed/Thu
    if(totalMin < PRE_START){ session = 'overnight'; }
    else if(totalMin < REGULAR_START){ session = 'pre'; }
    else if(totalMin < REGULAR_END){ session = 'regular'; }
    else if(totalMin < AFTER_END){ session = 'after'; }
    else { session = 'overnight'; }
  }
  return { session, timeStr };
}

// Full IANA timezone coverage via the browser's own Intl data (400+ zones) instead of
// a small curated list, so any region can be added — not just the handful of major
// cities picked out by hand. Falls back to the curated list on very old browsers that
// don't support Intl.supportedValuesOf yet (added to the spec in 2022).
function getAllTimezones(){
  try{
    if(typeof Intl.supportedValuesOf === 'function'){
      return Intl.supportedValuesOf('timeZone');
    }
  }catch(e){ /* fall through to the fallback list below */ }
  return TIMEZONE_PRESETS.map(p=>p.tz);
}

function tzToLabel(tz){
  const segments = tz.split('/');
  return segments[segments.length - 1].replace(/_/g, ' ');
}

  `;
  const selectEl = document.getElementById('wcTimezoneSelect');
  const searchEl = document.getElementById('wcTimezoneSearch');

  function populateOptions(filterText){
    const q = (filterText || '').trim().toLowerCase();
    const filtered = q
      ? allTz.filter(tz => tz.toLowerCase().includes(q) || tzToLabel(tz).toLowerCase().includes(q))
      : allTz;
    selectEl.innerHTML = filtered.map(tz => `<option value="${tz}">${tzToLabel(tz)} (${tz})</option>`).join('')
      || `<option value="" disabled>${L('wc_noMatch')}</option>`;
  }
  populateOptions('');
  searchEl.addEventListener('input', ()=>{ populateOptions(searchEl.value); });

  document.getElementById('wcAddBtn').addEventListener('click', async ()=>{
    const tz = selectEl.value;
    if(!tz) return;
    pushUndo();
    if(!state.worldClockCities) state.worldClockCities = [];
    state.worldClockCities.push({id: cryptoId(), label: tzToLabel(tz), tz});
    await saveState();
    renderWorldClock();
  });
}

function renderWorldClock(){
  const el = document.getElementById('worldClockDisplay');
  if(!el) return;
  const cities = state.worldClockCities || [];
  const lang = state.language || 'zh';
  const weekdayNames = WEEKDAY_NAMES[lang] || WEEKDAY_NAMES.en;

  el.innerHTML = `
    <div class="world-clock-grid">
      ${cities.map((c,i)=>{
        let dateStr = '-', timeStr = '-', wd = '-';
        try{
          const parts = new Intl.DateTimeFormat('en-US', {
            timeZone: c.tz, month:'2-digit', day:'2-digit',
            hour:'numeric', minute:'numeric', hour12:false, weekday:'short'
          }).formatToParts(new Date());
          const map = {};
          parts.forEach(p=>{ map[p.type] = p.value; });
          dateStr = `${map.month}/${map.day}`;
          const hh = String(Number(map.hour) % 24).padStart(2,'0');
          timeStr = `${hh}:${map.minute}`;
          const idx = WEEKDAY_SHORT_EN.indexOf(map.weekday);
          wd = idx>=0 ? weekdayNames[idx] : map.weekday;
        }catch(e){ /* invalid/unsupported timezone string — leave the dashes */ }
        return `
          <div class="world-clock-card" data-wc-card="${i}" title="${L('wc_longPressHint')}">
            <div class="wc-top">
              <span class="wc-name">${c.label}</span>
              <div class="wc-actions">
                <button class="wc-move" data-action="wcUp" data-idx="${i}" ${i===0?'disabled':''} title="${L('wc_moveUp')}">▲</button>
                <button class="wc-move" data-action="wcDown" data-idx="${i}" ${i===cities.length-1?'disabled':''} title="${L('wc_moveDown')}">▼</button>
                <button class="wc-del" data-action="wcDel" data-idx="${i}" title="${L('wc_remove')}">×</button>
              </div>
            </div>
            <div class="wc-date">${dateStr}</div>
            <div class="wc-time">${timeStr}</div>
            <div class="wc-weekday">${wd}</div>
          </div>
        `;
      }).join('') || `<div style="color:var(--text-dim);font-size:12px;">${L('wc_empty')}</div>`}
    </div>
  `;

  // Long-press (touch: touchstart+hold, desktop: mousedown+hold) reveals the delete
  // button for that card instead of showing it all the time — the always-visible ×
  // was crowding longer city names like "Beijing" or "New York" on narrow screens.
  const LONG_PRESS_MS = 500;
  el.querySelectorAll('.world-clock-card').forEach(card=>{
    let pressTimer = null;
    const reveal = () => { card.classList.add('show-delete'); };
    const cancelTimer = () => { if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; } };
    const startTimer = () => { cancelTimer(); pressTimer = setTimeout(reveal, LONG_PRESS_MS); };
    card.addEventListener('touchstart', startTimer, {passive:true});
    card.addEventListener('touchend', cancelTimer);
    card.addEventListener('touchmove', cancelTimer);
    card.addEventListener('touchcancel', cancelTimer);
    card.addEventListener('mousedown', startTimer);
    card.addEventListener('mouseup', cancelTimer);
    card.addEventListener('mouseleave', cancelTimer);
    // suppress the browser's native long-press context menu / text-selection callout
    card.addEventListener('contextmenu', (e)=>{ e.preventDefault(); });
  });

  el.querySelectorAll('[data-action="wcUp"]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const idx = Number(btn.dataset.idx);
      if(idx > 0){
        pushUndo();
        const arr = state.worldClockCities;
        [arr[idx-1], arr[idx]] = [arr[idx], arr[idx-1]];
        await saveState();
        renderWorldClock();
      }
    });
  });
  el.querySelectorAll('[data-action="wcDown"]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const idx = Number(btn.dataset.idx);
      const arr = state.worldClockCities;
      if(idx < arr.length - 1){
        pushUndo();
        [arr[idx+1], arr[idx]] = [arr[idx], arr[idx+1]];
        await saveState();
        renderWorldClock();
      }
    });
  });
  el.querySelectorAll('[data-action="wcDel"]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      pushUndo();
      const idx = Number(btn.dataset.idx);
      state.worldClockCities.splice(idx, 1);
      await saveState();
      renderWorldClock();
    });
  });
}

function updatePnlHistory(totalPnL){
  if(!state.pnlHistory) state.pnlHistory = [];
  const today = new Date().toISOString().slice(0,10);
  const idx = state.pnlHistory.findIndex(h=>h.date===today);
  if(idx>=0){ state.pnlHistory[idx].pnl = totalPnL; }
  else { state.pnlHistory.push({date:today, pnl:totalPnL}); }
  if(state.pnlHistory.length>30) state.pnlHistory = state.pnlHistory.slice(-30);
  saveState();
}

async function refreshAllPrices(){
  // 现价刷新：速度快，Finnhub免费版允许每分钟60次调用，所有标的并行请求。
  // MA20拆分成了下面单独的、较慢的按钮，因为它需要另一个限流更严格的数据源，
  // 而且MA20（20日均线）本来一天只变一次，没必要每次刷现价都跟着一起等。
  const mainBtn = document.getElementById('refreshPricesBtn');
  const quickBtn = document.getElementById('quickRefreshBtn');
  const apiKeyInput = document.getElementById('finnhubApiKeyInput');
  const apiKey = (apiKeyInput ? apiKeyInput.value.trim() : state.apiKey) || '';
  if(!apiKey){
    alert(L('refresh_needKey'));
    return;
  }
  state.apiKey = apiKey;
  [mainBtn, quickBtn].forEach(b=>{ if(b){ b.textContent = L('refresh_loading'); b.disabled = true; } });
  pushUndo();
  let priceSuccessCount = 0;

  // 网格建仓的股票和定投计划是两个独立的数组，但都有symbol和currentPrice字段，
  // 完全可以共用同一套Finnhub行情拉取逻辑——之前只遍历了state.stocks，
  // 这就是为什么定投持仓一直刷不到最新价格的原因。
  let dcaSuccessCount = 0;
  await Promise.all([
    ...state.stocks.map(async (s)=>{
      try{
        const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(s.symbol)}&token=${encodeURIComponent(apiKey)}`);
        const data = await res.json();
        if(data && typeof data.c === 'number' && data.c > 0){
          s.currentPrice = data.c;
          priceSuccessCount++;
        }
      }catch(e){ /* 单只股票失败不影响其他标的继续刷新 */ }
    }),
    ...(state.dcaPlans||[]).map(async (p)=>{
      if(!p.symbol) return;
      try{
        const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(p.symbol)}&token=${encodeURIComponent(apiKey)}`);
        const data = await res.json();
        if(data && typeof data.c === 'number' && data.c > 0){
          p.currentPrice = data.c;
          dcaSuccessCount++;
        }
      }catch(e){ /* 单个定投计划失败不影响其他计划继续刷新 */ }
    }),
  ]);

  await saveState();
  render();
  const freshQuickBtn = document.getElementById('quickRefreshBtn');
  if(freshQuickBtn){ freshQuickBtn.textContent = L('refresh_quickBtn'); freshQuickBtn.disabled = false; }
  const freshMainBtn = document.getElementById('refreshPricesBtn');
  if(freshMainBtn){ freshMainBtn.textContent = L('refresh_btn'); freshMainBtn.disabled = false; }
  alert(`${L('refresh_done')}${priceSuccessCount} / ${state.stocks.length}${L('refresh_dcaDone')}${dcaSuccessCount} / ${(state.dcaPlans||[]).length}`);
}

async function refreshAllMA20(){
  // MA20单独刷新：明显更慢，因为Alpha Vantage免费版限制每分钟最多5次调用，
  // 只能一只一只标的排队请求、中间加延迟。跟现价刷新分开，这样平时快速看一眼
  // 现价不用被MA20拖慢——MA20本来一天只需要更新一次。
  const ma20Btn = document.getElementById('refreshMA20Btn');
  const avKeyInput = document.getElementById('alphaVantageApiKeyInput');
  const avKey = (avKeyInput ? avKeyInput.value.trim() : state.alphaVantageKey) || '';
  if(!avKey){
    alert(L('refresh_needAvKey'));
    return;
  }
  state.alphaVantageKey = avKey;
  if(ma20Btn){ ma20Btn.textContent = L('refresh_loading'); ma20Btn.disabled = true; }
  pushUndo();
  let ma20SuccessCount = 0;

  for(let i=0; i<state.stocks.length; i++){
    const s = state.stocks[i];
    if(ma20Btn){ ma20Btn.textContent = `${L('refresh_loading')} ${i+1}/${state.stocks.length}`; }
    try{
      const avRes = await fetch(`https://www.alphavantage.co/query?function=TIME_SERIES_DAILY&symbol=${encodeURIComponent(s.symbol)}&apikey=${encodeURIComponent(avKey)}`);
      const avData = await avRes.json();
      const series = avData && avData['Time Series (Daily)'];
      if(series){
        const closes = Object.keys(series).sort().reverse().slice(0,20).map(d=>Number(series[d]['4. close']));
        if(closes.length > 0){
          const avg = closes.reduce((a,b)=>a+b, 0) / closes.length;
          s.ma20 = Math.round(avg*100)/100;
          ma20SuccessCount++;
        }
      }
      // 获取失败（额度用完/不支持该代码）时，保留原来手动填写的MA20，不清空
    }catch(e){ /* MA20获取失败，保留原值 */ }
    if(i < state.stocks.length - 1){
      await new Promise(resolve=>setTimeout(resolve, 13000));
    }
  }

  await saveState();
  render();
  const freshMA20Btn = document.getElementById('refreshMA20Btn');
  if(freshMA20Btn){ freshMA20Btn.textContent = L('refresh_ma20Btn'); freshMA20Btn.disabled = false; }
  alert(`${L('refresh_ma20Done2')}${ma20SuccessCount} / ${state.stocks.length}`);
}

  `;

    nameEl.addEventListener('dblclick', ()=>{
      const idx = Number(nameEl.dataset.idx);
      const oldVal = state.categories[idx];
      const input = document.createElement('input');
      input.type = 'text';
      input.value = oldVal;
      input.className = 'label-edit-input';
      input.style.width = Math.max(60, oldVal.length*8) + 'px';
      nameEl.replaceWith(input);
      input.focus();
      input.select();
      let committed = false;
      const commit = async ()=>{
        if(committed) return;
        committed = true;
        pushUndo();
        const newVal = input.value.trim() || oldVal;
        state.categories[idx] = newVal;
        state.stocks.forEach(s=>{ if(s.category===oldVal) s.category = newVal; });
        if(state.categoryThresholds && state.categoryThresholds[oldVal]!==undefined){
          state.categoryThresholds[newVal] = state.categoryThresholds[oldVal];
          delete state.categoryThresholds[oldVal];
        }
        await saveState();
        render();
      };
      input.addEventListener('blur', commit);
      input.addEventListener('keydown', (ev)=>{
        if(ev.key === 'Enter'){ input.blur(); }
        if(ev.key === 'Escape'){ committed = true; render(); }
      });
    });
  });
  el.querySelectorAll('.cat-del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      pushUndo();
      const idx = Number(btn.dataset.idx);
      const removed = state.categories[idx];
      state.categories.splice(idx,1);
      state.stocks.forEach(s=>{ if(s.category===removed) s.category=''; });
      if(state.categoryThresholds && state.categoryThresholds[removed]!==undefined){
        delete state.categoryThresholds[removed];
      }
      await saveState();

  el.querySelectorAll('.cat-threshold-input').forEach(inp=>{
    inp.addEventListener('change', async (e)=>{
      pushUndo();
      const cat = e.target.dataset.cat;
      if(!state.categoryThresholds) state.categoryThresholds = {};
      state.categoryThresholds[cat] = e.target.value === '' ? (state.concentrationThresholdPct ?? 30) : Number(e.target.value);
      await saveState();
      render();
    });
  });
  document.getElementById('addCategoryBtn').addEventListener('click', async ()=>{
    const inp = document.getElementById('newCategoryInput');
    const val = inp.value.trim();
    if(!val) return;
    pushUndo();
    if(!state.categories.includes(val)) state.categories.push(val);
    await saveState();
    render();
  });
}

const CATEGORY_PALETTE = ['#E63232','#F2C230','#3AA8E0','#43A047','#9B59B6'];

function buildCategoryChart(totalAssets, cashRemaining){
  const el = document.getElementById('categoryChart');
  if(!el) return;
  const catTotals = {};
  state.categories.forEach(c=> catTotals[c]=0);
  let uncategorized = 0;
  state.stocks.forEach(s=>{
    const c = computeStock(s);
    const val = c.marketValue || 0;
    if(s.category && catTotals.hasOwnProperty(s.category)){
      catTotals[s.category] += val;
    } else {
      uncategorized += val;
    }
  });
  (state.dcaPlans||[]).forEach(p=>{
    const c = computeDcaPlan(p);
    const val = c.marketValue || 0;
    if(p.category && catTotals.hasOwnProperty(p.category)){
      catTotals[p.category] += val;
    } else {
      uncategorized += val;
    }
  });
  const total = totalAssets > 0 ? totalAssets : 1;
  const defaultThresholdPct = (state.concentrationThresholdPct!=null) ? Number(state.concentrationThresholdPct) : 30;
  // Two-tier warning: yellow lights up at 80% of the category's threshold (an early
  // heads-up), red lights up once the threshold itself is actually exceeded.
  const YELLOW_WARN_RATIO = 0.8;
  const namedCatSegments = state.categories.map((cat,i)=>{
    const value = catTotals[cat];
    const weightPct = totalAssets>0 ? value/total*100 : 0;
    const catThresholdPct = (state.categoryThresholds && state.categoryThresholds[cat]!=null) ? Number(state.categoryThresholds[cat]) : defaultThresholdPct;
    let warnLevel = 'none';
    if(totalAssets>0 && catThresholdPct>0){
      if(weightPct > catThresholdPct) warnLevel = 'red';
      else if(weightPct >= catThresholdPct*YELLOW_WARN_RATIO) warnLevel = 'yellow';
    }
    return {label:cat, value, color:(state.categoryColors && state.categoryColors[cat]) ? state.categoryColors[cat] : CATEGORY_PALETTE[i % CATEGORY_PALETTE.length], warnLevel, weightPct, catThresholdPct};
  });
  const segments = namedCatSegments.slice();
  if(uncategorized > 0){ segments.push({label:L('cat_uncategorized'), value:uncategorized, color:'#999999', warnLevel:'none'}); }
  segments.push({label:L('cat_cash'), value:cashRemaining, color:'#000000', warnLevel:'none'});
  const barHtml = segments.filter(s=>s.value>0).map(s=>{
    const w = (s.value/total*100).toFixed(2);
    return `<div style="width:${w}%;background:${s.color};" title="${s.label}"></div>`;
  }).join('');
  const legendHtml = segments.map(s=>{
    const w = totalAssets>0 ? s.value/total : 0;
    const warnColor = s.warnLevel==='red' ? 'var(--warn-red)' : (s.warnLevel==='yellow' ? 'var(--warn-yellow-text)' : '');
    const warnDot = s.warnLevel!=='none' ? `<span class="warn-dot warn-${s.warnLevel}"></span>` : '';
    return `
      <div class="weight-row">
        <div class="wr-top">
          <span class="wr-name"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${s.color};margin-right:6px;"></span>${s.label}</span>
          <span class="wr-pct" style="${warnColor?`color:${warnColor};font-weight:700;`:''}">${warnDot}${pct(w)} · $${fmt(s.value)}</span>
        </div>
      </div>
    `;
  }).join('');
  const redCats = namedCatSegments.filter(s=>s.warnLevel==='red');
  const yellowCats = namedCatSegments.filter(s=>s.warnLevel==='yellow');
  const warnTriangleSvg = (colorVar) => `<svg class="warn-triangle" width="15" height="15" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" fill="${colorVar}" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/><line x1="12" y1="9.5" x2="12" y2="13.5" stroke="#000000" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="16.5" r="1" fill="#000000"/></svg>`;
  const redWarningHtml = redCats.length>0 ? `<div class="concentration-warning warn-red" style="display:flex;align-items:center;">${warnTriangleSvg('#E74C3C')}<span>${redCats.map(s=>`${s.label} ${pct(s.weightPct/100)}`).join(' · ')} ${L('concentration_warningSuffixRed')}</span></div>` : '';
  const yellowWarningHtml = yellowCats.length>0 ? `<div class="concentration-warning warn-yellow" style="display:flex;align-items:center;">${warnTriangleSvg('var(--warn-yellow)')}<span>${yellowCats.map(s=>`${s.label} ${pct(s.weightPct/100)}`).join(' · ')} ${L('concentration_warningSuffixYellow')}</span></div>` : '';
  el.innerHTML = `
    ${redWarningHtml}
    ${yellowWarningHtml}
    <div style="display:flex;height:16px;border-radius:8px;overflow:hidden;margin-bottom:14px;background:var(--surface-2);">${barHtml}</div>
    ${legendHtml}
  `;
}

function buildPnlRankChart(){
  const stockRows = state.stocks.map(s=>{
    const c = computeStock(s);
    return {name:s.name, symbol:s.symbol, pnl:c.totalPnl, pnlPct:c.totalPnlPct};
  });
  const dcaRows = (state.dcaPlans||[]).map(p=>{
    const c = computeDcaPlan(p);
    return {name:p.name+'（定投）', symbol:p.symbol, pnl:c.pnl, pnlPct:c.pnlPct};
  });
  const rows = stockRows.concat(dcaRows).filter(r=> (state.pnlSortMetric === 'pct' ? r.pnlPct!==null : r.pnl!==null));

  const toggleBtn = document.getElementById('pnlSortToggleBtn');
  if(toggleBtn){
    toggleBtn.textContent = state.pnlSortDir === 'asc' ? L('sort_asc') : L('sort_desc');
  }
  const metricBtn = document.getElementById('pnlSortMetricBtn');
  if(metricBtn){
    metricBtn.textContent = state.pnlSortMetric === 'pct' ? L('pnlrank_metric_pct') : L('pnlrank_metric_amount');
  }

  if(rows.length === 0){
    return `<div style="color:var(--text-dim);font-size:12px;">${L('pnlrank_empty')}</div>`;
  }
  const dir = state.pnlSortDir || 'desc';
  const metric = state.pnlSortMetric || 'amount';
  const key = metric === 'pct' ? 'pnlPct' : 'pnl';
  rows.sort((a,b)=> dir==='asc' ? a[key]-b[key] : b[key]-a[key]);
  const maxAbs = Math.max(...rows.map(r=>Math.abs(r[key])), metric==='pct' ? 0.01 : 1);
  return rows.map(r=>{
    const val = r[key];
    const color = val >= 0 ? 'var(--up)' : 'var(--down)';
    const halfPct = Math.abs(val)/maxAbs*50;
    const left = val >= 0 ? 50 : 50 - halfPct;
    const displayVal = metric === 'pct' ? `${val>=0?'+':''}${(val*100).toFixed(2)}%` : `${r.pnl>=0?'+':''}$${fmt(r.pnl)}`;
    return `
      <div class="pnl-rank-row">
        <div class="pnl-rank-name">${r.name} (${r.symbol})</div>
        <div class="pnl-rank-track">
          <div class="pnl-rank-zero"></div>
          <div class="pnl-rank-bar" style="left:${left}%;width:${halfPct}%;background:${color};"></div>
        </div>
        <div class="pnl-rank-value" style="color:${color}">${displayVal}</div>
      </div>
    `;
  }).join('');
}

function renderTrendMinMax(){
  const el = document.getElementById('trendMinMax');
  if(!el) return;
  const hist = (state.pnlHistory||[]).slice(-30);
  if(hist.length === 0){ el.textContent = ''; return; }
  const values = hist.map(h=>h.pnl);
  const maxV = Math.max(...values);
  const minV = Math.min(...values);
  const fmtSigned = v => (v>=0?'+':'') + '$' + fmt(v);
  el.innerHTML = `${L('trend_maxLabel')}<span style="color:var(--up);font-weight:600;">${fmtSigned(maxV)}</span> · ${L('trend_minLabel')}<span style="color:var(--down);font-weight:600;">${fmtSigned(minV)}</span>`;
}

function buildTrendChart(){
  const hist = (state.pnlHistory||[]).slice(-30);
  if(hist.length < 2){
    return `<div class="editable-label" data-label-key="trend_empty" style="color:var(--text-dim);font-size:12px;padding:6px 2px;">${L('trend_empty')}</div>`;
  }
  const values = hist.map(h=>h.pnl);
  const minV = Math.min(...values, 0);
  const maxV = Math.max(...values, 0);
  const range = (maxV - minV) || 1;
  // Each day gets a fixed pixel width so 30 points stay readable (dots/labels don't
  // crowd together) instead of squeezing to fit a fixed container — the chart just
  // grows wider and scrolls horizontally past a handful of days.
  const PER_DAY_PX = 40;
  const h = 120, padX = 26, padY = 16;
  const w = Math.max(300, padX*2 + (hist.length - 1) * PER_DAY_PX);
  const stepX = hist.length > 1 ? (w - padX*2) / (hist.length - 1) : 0;
  const toY = v => padY + (h - padY*2) * (1 - (v - minV)/range);
  const points = hist.map((pt,i)=>({x: padX + i*stepX, y: toY(pt.pnl), ...pt}));
  const pathD = points.map((p,i)=> (i===0?'M':'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
  const zeroY = toY(0);
  const latest = values[values.length-1];
  const lineColor = latest >= 0 ? 'var(--up)' : 'var(--down)';
  const dots = points.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="${lineColor}"></circle>`).join('');
  const labels = points.map(p=>`<text x="${p.x.toFixed(1)}" y="${h-2}" font-size="8" fill="#8C8367" text-anchor="middle">${p.date.slice(5)}</text>`).join('');
  return `
    <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;">
      <svg viewBox="0 0 ${w} ${h}" width="${w}" height="130" style="display:block;">
        <line x1="${padX}" y1="${zeroY.toFixed(1)}" x2="${w-padX}" y2="${zeroY.toFixed(1)}" stroke="#DCD4BC" stroke-dasharray="3,3"/>
        <path d="${pathD}" fill="none" stroke="${lineColor}" stroke-width="2"/>
        ${dots}
        ${labels}
      </svg>
    </div>
    <div style="text-align:right;font-family:'CharterEmbedded','Charter','Bitstream Charter','Sitka Text',Cambria,'IBM Plex Mono', monospace;font-size:13px;color:${lineColor};font-weight:700;padding:4px 4px 0;">
      ${latest>=0?'+':''}$${fmt(latest)}
    </div>
  `;
}

function computeStock(s){
  const plannedList = s.batches.map(b=>{
    const amt = s.budget * b.pct;
    const shares = b.trigger ? Math.round(amt / b.trigger) : 0;
    return {...b, plannedAmt:amt, plannedShares:shares};
  });

  let execShares = 0, execAmt = 0;
  plannedList.forEach(b=>{
    if(b.executed){
      const price = b.actualPrice ?? b.trigger ?? 0;
      const shares = b.actualShares ?? b.plannedShares;
      execAmt += price*shares;
      execShares += shares;
    }
  });

  // Gross bought position: existing holdings + all executed entry tiers, before any sells
  const boughtShares = (s.origShares||0) + execShares;
  const boughtCostTotal = (s.origShares||0)*(s.origCost||0) + execAmt;
  const avgCost = boughtShares > 0 ? boughtCostTotal/boughtShares : 0;

  // Sell records: each sale is booked against the (single) average buy cost above.
  // This keeps the accounting consistent with the rest of the app, which already
  // pools existing holdings + all entry tiers into one averaged cost rather than
  // tracking individual purchase lots (FIFO/LIFO).
  const sellList = (s.sells||[]).slice().sort((a,b)=>{
    const da = a.date||'', db = b.date||'';
    if(da<db) return -1; if(da>db) return 1; return 0;
  });
  let soldShares = 0, soldProceeds = 0, realizedPnl = 0;
  sellList.forEach(sl=>{
    const shares = sl.shares||0;
    const price = sl.price||0;
    soldShares += shares;
    soldProceeds += shares*price;
    realizedPnl += shares*(price - avgCost);
  });

  const newShares = boughtShares - soldShares;
  const newCostTotal = avgCost * newShares;
  const pctStop = avgCost * (1 - (s.stopLossPct||0)/100);
  const ma20Val = (s.ma20 !== null && s.ma20 !== undefined && s.ma20 !== '') ? Number(s.ma20) : null;
  const stopLossMode = s.stopLossMode || 'ratio';
  const price = s.currentPrice;

  let stopLossPrice = null;
  if(stopLossMode === 'ratio'){ stopLossPrice = pctStop; }
  else if(stopLossMode === 'ma20'){ stopLossPrice = ma20Val; }
  // stopLossMode === 'off' -> 不设止损，stopLossPrice保持null

  const marketValue = (price!==null && price!==undefined) ? newShares*price : null;
  const pnl = marketValue!==null ? marketValue - newCostTotal : null; // unrealized (floating) P&L on shares still held
  const pnlPct = (pnl!==null && newCostTotal>0) ? pnl/newCostTotal : null;
  const totalPnl = (pnl!==null || soldShares>0) ? (pnl||0) + realizedPnl : null; // realized + unrealized combined
  const totalPnlPct = (totalPnl!==null && boughtCostTotal>0) ? totalPnl/boughtCostTotal : null;

  // riskLevel: 'off' no stop configured, 'unknown' missing inputs, 'breach' stop hit,
  // 'warn' price sits within the warning buffer above the stop line, 'ok' otherwise.
  let riskLevel;
  if(stopLossMode === 'off'){ riskLevel = 'off'; }
  else if(stopLossPrice === null || price === null || newShares<=0){ riskLevel = 'unknown'; }
  else if(price <= stopLossPrice){ riskLevel = 'breach'; }
  else {
    const warnBufferPct = (typeof state !== 'undefined' && state.warnBufferPct != null) ? Number(state.warnBufferPct) : 3;
    const headroomPct = (price - stopLossPrice) / price * 100;
    riskLevel = headroomPct <= warnBufferPct ? 'warn' : 'ok';
  }
  const riskOk = riskLevel==='off' ? 'off' : (riskLevel==='unknown' ? null : (riskLevel==='breach' ? false : true));
  const ma20Status = (price!==null && ma20Val !== null) ? (price > ma20Val ? '站上MA20':'跌破MA20') : '-';

  return { plannedList, execShares, execAmt, boughtShares, boughtCostTotal, sellList, soldShares, soldProceeds, realizedPnl, newShares, newCostTotal, avgCost, pctStop, ma20Val, stopLossPrice, stopLossMode, marketValue, pnl, pnlPct, totalPnl, totalPnlPct, riskOk, riskLevel, ma20Status };
}

function fitRowFont(headEl, actionsEl, baseSize, minScale){
  if(!headEl || !actionsEl) return;
  baseSize = baseSize || 12;
  minScale = minScale || 0.5;
  actionsEl.style.fontSize = baseSize + 'px';
  let scale = 1;
  let guard = 0;
  while(headEl.scrollWidth > headEl.clientWidth + 0.5 && scale > minScale && guard < 24){
    scale -= 0.04;
    actionsEl.style.fontSize = (baseSize*scale).toFixed(2) + 'px';
    guard++;
  }
}

        if(field==='amountPerPeriod' || field==='currentPrice' || field==='manualShares' || field==='manualAvgCost'){

      render();

      clone.executions = (clone.executions||[]).map(e=>({...e, id: cryptoId()}));
      const idx = state.dcaPlans.findIndex(x=>x.id===p.id);
      state.dcaPlans.splice(idx+1, 0, clone);

      render();

            render();

            render();

            render();

          el.addEventListener('change', async (e)=>{
            pushUndo();
            let val = e.target.value === '' ? null : Number(e.target.value);

            await saveState();
            render();
          });
        }
      });
    });
  });

  const summaryEl = document.getElementById('dcaSummary');
  if(summaryEl){
    const totalPnlPct = (sumInvested>0 && anyValue) ? sumPnl/sumInvested : null;
    summaryEl.innerHTML = state.dcaPlans.length ? `
      <div class="unified-grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr));">
